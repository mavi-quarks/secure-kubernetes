apiVersion: v1
kind: Pod
metadata:
  name: red-color-api
  labels:
    app: red-color-api
spec:
  containers:
  - name: red-color-api
    image: smcatapan/color-api:1.3.1
    env:
      - name: DEFAULT_COLOR
        valueFrom:
          configMapKeyRef:
            name: red-config
            key: COLOR
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
    ports:
      - containerPort: 80
