apiVersion: v1
kind: Pod
metadata:
  name: color-api
  namespace: dev
  labels:
      app: color-api
spec:
  containers:
  - name: color-api
    image: lmacademy/color-api:1.1.0
    resources:
      requests:
        memory: "256Mi"
        cpu: "200m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    ports:
    - containerPort: 80