apiVersion: v1
kind: Pod
metadata:
  name: heavy-api
  namespace: dev
  labels:
      app: heavy-api
spec:
  containers:
  - name: heavy-api
    image: lmacademy/color-api:1.1.0
    resources:
      requests:
        memory: "1Mi"
        cpu: "1"
      limits:
        memory: "2Mi"
        cpu: "2"
    ports:
    - containerPort: 80